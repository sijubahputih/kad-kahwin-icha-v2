<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Walimatul Urus | Haiqal & Icha</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- PAGE 1 -->
  <section class="opening" id="opening">

    <div class="opening-frame"></div>
<div class="satin"></div>

<div class="petals" id="petals"></div>

<div class="sparkles">
  <span class="sparkle s1"></span>
  <span class="sparkle s2"></span>
  <span class="sparkle s3"></span>
  <span class="sparkle s4"></span>
  <span class="sparkle s5"></span>
</div>
    <div class="opening-content">

      <div class="bismillah">
        بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
      </div>

      <p class="eyebrow">
        JEMPUTAN KE MAJLIS
      </p>

      <h2 class="wedding-title">
        WALIMATUL URUS
      </h2>

      <div class="divider">
        <span></span>
        <b>♡</b>
        <span></span>
      </div>

      <h1 class="couple-name"
          id="openingGroom"></h1>

      <div class="ampersand">&</div>

      <h1 class="couple-name"
          id="openingBride"></h1>

      <p class="opening-date"
         id="openingDate"></p>

      <button class="open-btn"
              onclick="openInvitation()">
        BUKA JEMPUTAN
      </button>

    </div>

    <p class="tap-note">
      Sentuh untuk membuka
    </p>

  </section>


  <!-- PAGE 2 -->
  <main class="main-page"
        id="mainPage">

    <section class="hero">

      <p class="hero-eyebrow">
        WALIMATUL URUS
      </p>

      <h1 id="heroGroom"></h1>

      <div class="hero-and">&</div>

      <h1 id="heroBride"></h1>

      <p class="hero-date"
         id="heroDate"></p>

      <div class="countdown">

        <div class="count-item">
          <span id="days">0</span>
          <small>HARI</small>
        </div>

        <div class="count-item">
          <span id="hours">0</span>
          <small>JAM</small>
        </div>

        <div class="count-item">
          <span id="minutes">0</span>
          <small>MINIT</small>
        </div>

        <div class="count-item">
          <span id="seconds">0</span>
          <small>SAAT</small>
        </div>

      </div>

    </section>

  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>

</body>
</html>
